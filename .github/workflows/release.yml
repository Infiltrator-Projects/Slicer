# SPDX-License-Identifier: AGPL-3.0-or-later
name: Advanced release publishing

on:
  workflow_call:
    inputs:
      qualified_run_id:
        required: true
        type: string
      windows_run_id:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      qualified_run_id:
        description: "Verify run whose Linux DEB and native RUN qualification passed"
        required: true
        type: string
      windows_run_id:
        description: "Optional Windows Verify run at the same source commit (defaults to qualified run)"
        required: false
        type: string
  workflow_run:
    workflows: ["Verify"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

# Verify is the only producer of release binaries. Publication consumes the
# exact qualified bytes from Verify and never rebuilds them. Manual recovery
# repeats sealing only when DEB, native RUN and Windows qualification passed
# at the exact same source commit, including separate manual platform runs.
# GitHub itself supplies the source .zip and .tar.gz for the release tag.

jobs:
  publish:
    if: >-
      inputs.qualified_run_id != '' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        (github.event.workflow_run.event == 'workflow_dispatch' &&
         github.event.workflow_run.display_title == 'Release Slicer / all / main')) &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id || github.event.workflow_run.id }}
      WINDOWS_RUN_ID: ${{ inputs.windows_run_id || inputs.qualified_run_id || github.event.workflow_run.id }}
      RECOVERY_MODE: ${{ inputs.qualified_run_id != '' }}

    steps:
      - name: Validate qualified source run
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RECOVERY_MODE" == true ]]; then
            test "$GITHUB_REF" = refs/heads/main
            mkdir -p candidate-linux candidate-native candidate-windows
          fi
          [[ "$QUALIFIED_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$WINDOWS_RUN_ID" =~ ^[0-9]+$ ]]
          validate_run() {
            local run_id=$1 output=$2
            gh api "repos/${GH_REPO}/actions/runs/${run_id}" > "${output}-run.json"
            jq -e --arg repo "$GH_REPO" --arg recovery "$RECOVERY_MODE" '
              .repository.full_name == $repo and .head_repository.full_name == $repo and
              .path == ".github/workflows/ci.yml" and .head_branch == "main" and
              (.head_sha | test("^[0-9a-f]{40}$")) and
              .status == "completed" and
              (.event == "push" or (.event == "workflow_dispatch" and
                ($recovery == "true" or .display_title == "Release Slicer / all / main")))
            ' "${output}-run.json" > /dev/null
            gh api "repos/${GH_REPO}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" > "${output}-jobs.json"
            jq -e '.total_count < 100 and (.jobs | length) == .total_count' "${output}-jobs.json" > /dev/null
          }
          require_job() {
            local jobs=$1 job=$2
            jq -e --arg job "$job" '
              [.jobs[] | select(.name == $job)] |
              length == 1 and .[0].status == "completed" and .[0].conclusion == "success"
            ' "$jobs" > /dev/null
          }
          validate_run "$QUALIFIED_RUN_ID" qualified
          source_sha=$(jq -r '.head_sha' qualified-run.json)
          for job in 'Verify release contract' 'Build and qualify Linux .deb' 'Build and qualify Linux native .run'; do
            require_job qualified-jobs.json "$job"
          done
          if [[ "$WINDOWS_RUN_ID" != "$QUALIFIED_RUN_ID" ]]; then
            test "$RECOVERY_MODE" = true
            validate_run "$WINDOWS_RUN_ID" windows
            test "$(jq -r '.head_sha' windows-run.json)" = "$source_sha"
            require_job windows-jobs.json 'Verify release contract'
            require_job windows-jobs.json 'Build and qualify Windows .exe'
          else
            require_job qualified-jobs.json 'Build and qualify Windows .exe'
          fi
          printf 'SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          printf 'Using qualified Linux/native run %s and Windows run %s at source %s.\n' \
            "$QUALIFIED_RUN_ID" "$WINDOWS_RUN_ID" "$source_sha"

      - name: Download sealed qualified release bundle
        if: inputs.qualified_run_id == ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: slicer-release-assets
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.QUALIFIED_RUN_ID }}

      - name: Download qualified Linux candidate for recovery
        if: inputs.qualified_run_id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: slicer-linux-release
          path: candidate-linux
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.QUALIFIED_RUN_ID }}

      - name: Download qualified Windows candidate for recovery
        if: inputs.qualified_run_id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: slicer-windows-release
          path: candidate-windows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.WINDOWS_RUN_ID }}

      - name: Download qualified native installer candidate for recovery
        if: inputs.qualified_run_id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: slicer-native-release
          path: candidate-native
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.QUALIFIED_RUN_ID }}

      - name: Seal existing qualified bytes for recovery
        if: inputs.qualified_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < candidate-linux/support/VERSION)
          test "$(tr -d '[:space:]' < candidate-native/support/VERSION)" = "$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected_deb="slicer_${version}_amd64.deb"
          expected_installer="slicer-${version}-native-installer.run"
          expected_windows="slicer-${version}-windows.exe"
          mapfile -t debs < <(find candidate-linux/dist -maxdepth 1 -type f -name '*.deb' -printf '%f\n' | sort)
          mapfile -t windows_apps < <(find candidate-windows -maxdepth 1 -type f -name '*.exe' -printf '%f\n' | sort)
          mapfile -t installers < <(find candidate-native/dist -maxdepth 1 -type f -name '*.run' -printf '%f\n' | sort)
          test "${#debs[@]}" -eq 1
          test "${#windows_apps[@]}" -eq 1
          test "${#installers[@]}" -eq 1
          test "${debs[0]}" = "$expected_deb"
          test "${windows_apps[0]}" = "$expected_windows"
          test "${installers[0]}" = "$expected_installer"
          mkdir release
          cp "candidate-linux/dist/$expected_deb" "release/$expected_deb"
          cp "candidate-windows/$expected_windows" "release/$expected_windows"
          cp "candidate-native/dist/$expected_installer" "release/$expected_installer"
          test "$(dpkg-deb -f "release/$expected_deb" Package)" = "slicer"
          test "$(dpkg-deb -f "release/$expected_deb" Version)" = "$version"
          test "$(head -c 2 "release/$expected_windows")" = "MZ"
          chmod +x "release/$expected_installer"
          "release/$expected_installer" --help >/dev/null
          "release/$expected_installer" --metadata | jq -e \
            --arg source "$SOURCE_SHA" --arg version "$version" \
            '.source_sha == $source and .version == $version' >/dev/null
          (
            cd release
            sha256sum "$expected_deb" "$expected_installer" "$expected_windows" > RELEASE_SHA256SUMS.txt
            printf '%s\n' "$SOURCE_SHA" > RELEASE_SOURCE_SHA
            printf '%s\n' "$version" > RELEASE_VERSION
          )

      - name: Publish or verify immutable release
        shell: bash
        run: |
          set -euo pipefail

          test "$(cat release/RELEASE_SOURCE_SHA)" = "$SOURCE_SHA"
          version=$(tr -d '[:space:]' < release/RELEASE_VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}"

          (
            cd release
            sha256sum -c RELEASE_SHA256SUMS.txt
          )

          mapfile -t assets < <(
            awk 'NF == 2 { name=$2; sub(/^\*/, "", name); print name }' \
              release/RELEASE_SHA256SUMS.txt
          )
          test "${#assets[@]}" -eq 3
          test "$(printf '%s\n' "${assets[@]}" | sort -u | wc -l)" -eq 3

          deb=
          installer=
          windows_app=
          asset_paths=()
          for asset in "${assets[@]}"; do
            [[ "$asset" != */* ]]
            test -f "release/$asset"
            asset_paths+=("release/$asset")
            case "$asset" in
              *.deb)
                test -z "$deb"
                deb="$asset"
                ;;
              *.exe)
                test -z "$windows_app"
                windows_app="$asset"
                ;;
              *.run)
                test -z "$installer"
                installer="$asset"
                ;;
              *)
                printf 'Unexpected sealed release asset: %s\n' "$asset" >&2
                exit 1
                ;;
            esac
          done

          test -n "$deb"
          test -n "$installer"
          test -n "$windows_app"
          test "$deb" = "slicer_${version}_amd64.deb"
          test "$installer" = "slicer-${version}-native-installer.run"
          test "$windows_app" = "slicer-${version}-windows.exe"
          test "$(dpkg-deb -f "release/$deb" Package)" = "slicer"
          test "$(dpkg-deb -f "release/$deb" Version)" = "$version"
          test "$(head -c 2 "release/$windows_app")" = "MZ"
          chmod +x "release/$installer"
          "release/$installer" --help >/dev/null
          "release/$installer" --metadata | jq -e \
            --arg source "$SOURCE_SHA" --arg version "$version" \
            '.source_sha == $source and .version == $version' >/dev/null

          workflow_only_difference() {
            local base=$1 head=$2 comparison
            [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]] || return 1
            [[ "$base" != "$head" ]] || return 0
            comparison=$(mktemp)
            if ! gh api "repos/${GH_REPO}/compare/${base}...${head}" > "$comparison"; then
              rm -f "$comparison"
              return 1
            fi
            # A behind comparison does not reliably include its changed files.
            # Always inspect the complete forward comparison instead.
            if [[ "$(jq -r .status "$comparison")" == behind ]]; then
              if ! gh api "repos/${GH_REPO}/compare/${head}...${base}" > "$comparison"; then
                rm -f "$comparison"
                return 1
              fi
            fi
            if ! jq -e '
              (.status == "ahead" or .status == "identical") and .behind_by == 0 and
              (.files | type == "array" and length < 300) and
              all(.files[];
                (.filename | startswith(".github/workflows/")) and
                ((.previous_filename // .filename) | startswith(".github/workflows/")))
            ' "$comparison" > /dev/null; then
              rm -f "$comparison"
              return 1
            fi
            rm -f "$comparison"
          }

          current_main=$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')
          if ! workflow_only_difference "$SOURCE_SHA" "$current_main"; then
            printf 'Main %s differs from qualified source %s beyond safe workflow-only changes; refusing publication.\n' \
              "$current_main" "$SOURCE_SHA" >&2
            exit 1
          fi
          # GitHub can require workflows:write to tag an older workflow snapshot.
          # Current main is permitted only after every product file is proven
          # unchanged. Artifacts and native source metadata remain qualified.
          tag_source_sha=$current_main

          tag_exists=false
          tag_sha=
          if tag_identity=$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" \
              --jq '"\(.object.type) \(.object.sha)"' 2>/dev/null); then
            read -r tag_type tag_sha <<<"$tag_identity"
            if [[ "$tag_type" != "commit" ]]; then
              printf 'Release tag %s is not a lightweight commit tag; refusing to reinterpret it.\n' \
                "$tag" >&2
              exit 1
            fi

            if [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
              if ! workflow_only_difference "$SOURCE_SHA" "$tag_sha"; then
                printf 'Version %s is already tagged at %s, but qualified main %s changes product or build source; advance support/VERSION.\n' \
                  "$version" "$tag_sha" "$SOURCE_SHA" >&2
                exit 1
              fi
              if [[ "$RECOVERY_MODE" != true ]]; then
                printf 'Version %s is already tagged at %s; qualified main %s changes workflows only, so there is no new release intent.\n' \
                  "$version" "$tag_sha" "$SOURCE_SHA"
                exit 0
              fi
            fi
            # Preserve an existing tag, including a product-equivalent snapshot.
            tag_source_sha=$tag_sha
            tag_exists=true
          fi

          {
            printf 'Slicer %s\n\n' "$version"
            printf 'Changes: https://github.com/%s/blob/%s/docs/CHANGELOG.md\n\n' "$GH_REPO" "$SOURCE_SHA"
            printf 'The Linux DEB, native source installer and Windows installer passed platform qualification. The Linux interface also passed a graphical startup check.\n\n'
            printf 'Qualified release source: %s\n\nRelease tag source: %s\n' "$SOURCE_SHA" "$tag_source_sha"
            if [[ "$tag_source_sha" != "$SOURCE_SHA" ]]; then
              printf '\nOnly GitHub workflow files differ between these source snapshots. Published installers are the exact qualified bytes; the native installer downloads the pinned qualified source.\n'
            fi
          } > release-notes.md

          expected_assets=$(printf '%s\n' "${assets[@]}" | sort)

          verify_release_bytes() {
            local remote_assets tmp asset
            remote_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
            if [[ "$remote_assets" != "$expected_assets" ]]; then
              printf 'Release %s has an unexpected asset set.\n' "$tag" >&2
              return 1
            fi

            tmp=$(mktemp -d)
            if ! gh release download "$tag" --dir "$tmp"; then
              rm -rf "$tmp"
              return 1
            fi
            for asset in "${assets[@]}"; do
              if ! cmp -s "release/$asset" "$tmp/$asset"; then
                printf 'Remote asset %s differs from the qualified artifact.\n' "$asset" >&2
                rm -rf "$tmp"
                return 1
              fi
            done
            rm -rf "$tmp"
          }

          draft_exists=false
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft')
            if [[ "$is_draft" == true ]]; then
              draft_exists=true
              if [[ "$tag_exists" != true ]]; then
                draft_target=$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish')
                if [[ "$draft_target" != "$tag_source_sha" ]]; then
                  if [[ "$draft_target" == "$SOURCE_SHA" ]]; then
                    gh release edit "$tag" --target "$tag_source_sha"
                  else
                    printf 'Draft %s targets unexpected source %s.\n' \
                      "$tag" "$draft_target" >&2
                    exit 1
                  fi
                fi
              fi
              echo "Restoring interrupted draft $tag from sealed qualified assets."
              gh release edit "$tag" --notes-file release-notes.md
              gh release upload "$tag" "${asset_paths[@]}" --clobber
            else
              test "$tag_exists" = true
              verify_release_bytes
              echo "Exact immutable release $tag already exists; verified qualified bytes."
              printf '[Download Slicer %s](https://github.com/%s/releases/tag/%s)\n' "$version" "$GH_REPO" "$tag" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          if [[ "$draft_exists" != true ]]; then
            if [[ "$tag_exists" == true ]]; then
              gh release create "$tag" "${asset_paths[@]}" \
                --verify-tag \
                --draft \
                --title "Slicer $version" \
                --notes-file release-notes.md
            else
              gh release create "$tag" "${asset_paths[@]}" \
                --target "$tag_source_sha" \
                --draft \
                --title "Slicer $version" \
                --notes-file release-notes.md
            fi
          fi

          verify_release_bytes
          gh release edit "$tag" --draft=false --latest
          test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = false
          read -r published_tag_type published_tag_sha < <(
            gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '"\(.object.type) \(.object.sha)"'
          )
          test "$published_tag_type" = commit
          test "$published_tag_sha" = "$tag_source_sha"
          verify_release_bytes
          printf '[Download Slicer %s](https://github.com/%s/releases/tag/%s)\n' "$version" "$GH_REPO" "$tag" >> "$GITHUB_STEP_SUMMARY"
