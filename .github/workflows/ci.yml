# SPDX-License-Identifier: AGPL-3.0-or-later
name: Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  source:
    name: Verify release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version and repository-owned build machinery
        shell: bash
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < support/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cmake_version=$(sed -n 's/^set(SLIC3R_VERSION "\([^"]*\)").*/\1/p' version.inc)
          test "$cmake_version" = "$version"

          bash -n support/build-native.sh
          bash -n support/linux/build-deb.sh

          if grep -REn --include='*.yml' --include='*.yaml' \
            'uses:[[:space:]]+Prusa-Development/PrusaSlicer-Actions' \
            .github/workflows; then
            echo "Release/build workflows must be owned by this repository." >&2
            exit 1
          fi

          if grep -REn --include='*.yml' --include='*.yaml' \
            -e 'git[[:space:]]+push[^#]*--force' \
            -e 'git[[:space:]]+push[^#]*--delete' \
            -e 'git[[:space:]]+push[^#]*:refs/tags/' \
            -e 'gh[[:space:]]+release[[:space:]]+delete([[:space:]-]|$)' \
            -e 'gh[[:space:]]+api[^#]*(--method|-X)[[:space:]]+DELETE' \
            .github/workflows; then
            echo "Destructive repository automation is forbidden." >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "v${version}")
            head_commit=$(git rev-parse HEAD)
            if [[ "$tag_commit" != "$head_commit" ]] &&
               ! git diff --quiet "$tag_commit" HEAD -- . ':!.github/workflows'; then
              printf 'Version %s is already published at %s; advance support/VERSION before changing product or build source.\n' \
                "$version" "$tag_commit" >&2
              exit 1
            fi
          fi

  linux-release:
    name: Build and qualify Linux .deb
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install supported PrusaSlicer build prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf build-essential cmake dpkg-dev git \
            libdbus-1-dev libglu1-mesa-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev texinfo xauth xvfb

      - name: Build release package once
        shell: bash
        run: |
          set -euo pipefail
          support/linux/build-deb.sh --clean --jobs "$(nproc)"

      - name: Qualify exact Debian package
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < support/VERSION)
          deb="dist/infiltrator-slicer_${version}_amd64.deb"
          test -f "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "infiltrator-slicer"
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          test "$(dpkg-deb -f "$deb" Architecture)" = "amd64"
          dpkg-deb --contents "$deb" | grep -F './usr/bin/prusa-slicer' >/dev/null
          sudo apt-get install -y "./$deb"
          xvfb-run -a /usr/bin/prusa-slicer --version
          sudo dpkg -r infiltrator-slicer

      - name: Upload exact Linux release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: slicer-linux-release
          path: |
            dist/infiltrator-slicer_*.deb
            support/VERSION
          if-no-files-found: error
          retention-days: 14

  windows-release:
    name: Build and qualify Windows .exe
    needs: source
    # PrusaSlicer 2.9.6's build_win.bat explicitly supports Visual Studio
    # 2019/2022. Pin the hosted image to VS2022 instead of inheriting the
    # moving Windows 2025 image, which now carries VS2026.
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out exact verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup -y --no-progress
          }

      - name: Build Windows release installer once
        shell: pwsh
        run: '& ./support/windows/build-release.ps1'

      - name: Qualify exact Windows executable
        shell: pwsh
        run: |
          $Version = (Get-Content support/VERSION -Raw).Trim()
          $Artifact = "dist\slicer-$Version-windows.exe"
          if (-not (Test-Path $Artifact -PathType Leaf)) {
              throw "Missing Windows release artifact: $Artifact"
          }
          $Bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $Artifact))
          if ($Bytes.Length -lt 2 -or $Bytes[0] -ne 0x4D -or $Bytes[1] -ne 0x5A) {
              throw "Windows release artifact is not a PE executable."
          }

          $InstallDir = Join-Path $env:RUNNER_TEMP "slicer-install-smoke"
          $Process = Start-Process -FilePath (Resolve-Path $Artifact) `
              -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$InstallDir") `
              -Wait -PassThru
          if ($Process.ExitCode -ne 0) {
              throw "Windows installer smoke test failed with exit code $($Process.ExitCode)."
          }
          & (Join-Path $InstallDir 'prusa-slicer-console.exe') --version
          if ($LASTEXITCODE -ne 0) {
              throw "Installed Slicer console executable failed its --version smoke test."
          }

      - name: Upload exact Windows release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: slicer-windows-release
          path: dist/slicer-*-windows.exe
          if-no-files-found: error
          retention-days: 14

  release-assets:
    name: Seal exact qualified release assets
    needs: [linux-release, windows-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download exact Linux candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: slicer-linux-release
          path: candidate-linux

      - name: Download exact Windows candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: slicer-windows-release
          path: candidate-windows

      - name: Seal release bundle
        shell: bash
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < candidate-linux/support/VERSION)
          expected_deb="infiltrator-slicer_${version}_amd64.deb"
          expected_windows="slicer-${version}-windows.exe"

          mapfile -t debs < <(find candidate-linux -maxdepth 1 -type f -name '*.deb' -printf '%f\n' | sort)
          mapfile -t windows_apps < <(find candidate-windows -maxdepth 1 -type f -name '*.exe' -printf '%f\n' | sort)
          test "${#debs[@]}" -eq 1
          test "${#windows_apps[@]}" -eq 1
          test "${debs[0]}" = "$expected_deb"
          test "${windows_apps[0]}" = "$expected_windows"

          mkdir release
          cp "candidate-linux/$expected_deb" "release/$expected_deb"
          cp "candidate-windows/$expected_windows" "release/$expected_windows"

          test "$(dpkg-deb -f "release/$expected_deb" Package)" = "infiltrator-slicer"
          test "$(dpkg-deb -f "release/$expected_deb" Version)" = "$version"
          test "$(head -c 2 "release/$expected_windows")" = "MZ"

          (
            cd release
            sha256sum "$expected_deb" "$expected_windows" > RELEASE_SHA256SUMS.txt
            printf '%s\n' "$GITHUB_SHA" > RELEASE_SOURCE_SHA
            printf '%s\n' "$version" > RELEASE_VERSION
          )

      - name: Upload sealed release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: slicer-release-assets
          path: release/
          if-no-files-found: error
          retention-days: 14
